  --swim:#3b6ff0; --polo:#1f9d55; --dive:#e0622a; --art:#a855f7; --open:#1798b8; --mas:#db2777; --hd-a:#0f2a47; --hd-b:#17406b; --hd-sub:#9cc4ee; --ft-bg:#0a1019; --ft-ink:#93a3b8; --ft-line:#1f2d40; --ft-top:#2b6cb0; color-scheme:dark}}
:root[data-theme="dark"]{

.pop .tw{overflow-x:auto}.pop .tally{width:100%;border-collapse:collapse;font-size:13px}.pop .tally th,.pop .tally td{padding:4px 6px;border-bottom:1px solid var(--pop-line);text-align:center}.pop .tally th:first-child,.pop .tally td:first-child{text-align:left}.pop .tally tr.th td{background:var(--note);font-weight:700}

  if(ch.length)html+='<div class="chips"><h3>'+x.chiph+'</h3>'+ch.map(chipBtn).join('')+'</div>';
  var un=(g===NM-1)?EV.filter(function(e){return !e.start&&!e.month;}):[];
  if(un.length)html+='<div class="chips"><h3>'+x.unkh+'</h3>'+un.map(chipBtn).join('')+'</div>';
  return html+'</section>';
}
function renderCal(){var h='';for(var g=0;g<NM;g++)h+=monthHtml(g);cal.innerHTML=h;applyFilter();show(cur);}
function show(m){
  var prev=cur;cur=Math.max(0,Math.min(NM-1,m));fillMonths();
  Array.prototype.forEach.call(cal.children,function(s){var on=+s.dataset.m===cur;s.classList.toggle('on',on);s.classList.remove('in-l','in-r');
    if(on&&prev!==cur){void s.offsetWidth;s.classList.add(cur>prev?'in-r':'in-l');}});
  $('prev').disabled=cur%12===0;$('next').disabled=cur%12===11;['y0','y1','y2'].forEach(function(id,i){$(id).setAttribute('aria-pressed',Math.floor(cur/12)===i?'true':'false');});hidePop(true);
}
function applyFilter(){Array.prototype.forEach.call(cal.querySelectorAll('[data-id]'),function(n){var e=byId(n.dataset.id);n.classList.toggle('dim',!visible(e));});
  /* hidden items must not leave empty headings/boxes behind */
  Array.prototype.forEach.call(cal.querySelectorAll('.chips'),function(c){c.style.display=c.querySelector('.chip:not(.dim)')?'':'none';});
  Array.prototype.forEach.call(cal.querySelectorAll('.list'),function(l){
    var any=l.querySelector('.item:not(.dim)'),has=l.querySelector('.item'),m=l.querySelector('.nof');
    if(has&&!any){if(!m){m=document.createElement('p');m.className='none nof';l.appendChild(m);}m.textContent=t().none;}else if(m){m.remove();}
  });}
$('prev').onclick=function(){show(cur-1);};
$('next').onclick=function(){show(cur+1);};
$('msel').onchange=function(){show(Math.floor(cur/12)*12+(+$('msel').value));};
function fillMonths(){var x=t(),oh='';for(var i=0;i<12;i++){oh+='<option value="'+i+'">'+x.months[i]+'</option>';}$('msel').innerHTML=oh;$('msel').value=cur%12;}

/* floating detail card */
var pop=$('pop'),lastXY=[0,0];
/* an event is finished once its last day is before today (local date) */
function done(e){if(!e.end)return false;var n=new Date();return d(e.end)<Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());}
/* results posted while an event is still running */
function live(e){return !done(e)&&!!(e.results&&e.results.live);}
function popHtml(e){
  var x=t(),st=done(e)?x.stat.done:live(e)?x.stat.live:(x.stat[e.status]||x.stat.confirmed);
  var date=e.start?fmt(e.start,e.end):(e.month?x.monthOnly(x.months[e.month-1],x.year(e.year||BASEY)):x.noDate);
  function row(k,v,link){
    if(v)return '<dt>'+k+'</dt><dd>'+(link==='a'?'<a href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(v.replace(/^https?:\/\/(www\.)?/,''))+'</a>':esc(v))+'</dd>';
    return '<dt>'+k+'</dt><dd class="na">'+x.na+'</dd>';}
  var note=L(e,'note');
  var parts=(e.parts||[]).map(function(q){var v=L(q,'venue'),n=L(q,'note');
    return '<li><i style="background:var(--'+q.sport+')"></i><b>'+esc(L(q,'label')||x.sport[q.sport])+'</b><span class="pd">'+[q.start?fmt(q.start,q.end):(done(e)?'':x.noDate),v?esc(v):'',n?esc(n):''].filter(Boolean).join(' · ')+'</span></li>';}).join('');
  return '<div class="top" style="background:'+bg(e)+'"><div class="k">'+x.sport[e.sport]+' · '+x.tiername(e.tier)+'</div><div class="t">'+esc(L(e,'name'))+'</div></div>'+
   '<button class="x" type="button" aria-label="'+x.close+'">'+x.close+'</button><div class="bd"><dl>'+
   '<dt>'+x.lDate+'</dt><dd>'+date+'</dd>'+
   '<dt>'+x.lStat+'</dt><dd><span class="st'+(st[1]?' w':'')+'">'+st[0]+'</span></dd>'+
   '<dt>'+x.tierlbl+'</dt><dd>'+x.tiername(e.tier)+'<div class="tiernote">'+esc(x.tier[e.tier])+'</div></dd>'+
   (parts?'<dt>'+x.lParts+'</dt><dd><ul class="parts">'+parts+'</ul></dd>':'')+
   row(x.lLoc,place(e))+row(x.lVenue,L(e,'venue'))+row(x.lOrg,L(e,'organizer'))+row(x.lContact,L(e,'contact'))+row(x.lWeb,e.url,'a')+
   (note?'<dt>'+x.lNote+'</dt><dd>'+esc(note)+'</dd>':'')+'</dl>'+(done(e)?resHtml(e):(live(e)?resHtml(e):'')+xtraHtml(e))+'<button class="more" type="button" aria-expanded="false">'+(done(e)||live(e)?x.moreRes:x.more)+'</button></div>';
}
/* finished events: results (medal tally, records, Thai athletes, per-sport podiums) replace the costs section */
function resHtml(e){
  var x=t(),r=e.results;
  /* official results page(s): shown first so the full results are one click away */
  var off=r&&r.official&&r.official.length?'<div class="offl">'+r.official.map(function(q){return '<a href="'+esc(q.url)+'" target="_blank" rel="noopener">'+esc(L(q,'title')||x.offRes)+' ↗</a>';}).join('')+'</div>':'';
  if(!r||!(r.tally||r.thai||r.records||r.sports||r.src))return '<div class="xtra"><h4>'+x.rh+'</h4>'+off+'<p class="na rnone">'+(off?x.noResOff:x.noRes)+'</p></div>';
  function li(a){return (a||[]).map(function(q){return '<li>'+esc(L(q,'t'))+'</li>';}).join('');}
  var h='<div class="xtra res"><h4>'+x.rh+'</h4>'+off;
  if(r.tally&&r.tally.length){h+='<h5>'+x.tally+(L(r,'tally_note')?' <span class="sub">'+esc(L(r,'tally_note'))+'</span>':'')+'</h5><div class="tw"><table class="tally"><thead><tr><th>'+x.tCty+'</th><th>'+x.tG+'</th><th>'+x.tS+'</th><th>'+x.tB+'</th><th>'+x.tT+'</th></tr></thead><tbody>'+
    r.tally.map(function(q){function n(v){return v==null?'–':v;}var tot=q.t!=null?q.t:(q.s==null||q.b==null?'–':q.g+q.s+q.b);
      return '<tr'+(q.c_en==='Thailand'?' class="th"':'')+'><td>'+esc(L(q,'c'))+'</td><td>'+n(q.g)+'</td><td>'+n(q.s)+'</td><td>'+n(q.b)+'</td><td><b>'+tot+'</b></td></tr>';}).join('')+'</tbody></table></div>';}
  if(r.thai&&r.thai.length)h+='<h5 class="thh">'+x.thai+'</h5><ul class="rl thl">'+li(r.thai)+'</ul>';
  if(r.records&&r.records.length)h+='<h5>'+x.recs+'</h5><ul class="rl">'+li(r.records)+'</ul>';
  var sp=r.sports||[];
  if(sp.length){
    if(sp.length>1)h+='<div class="rtabs" role="tablist">'+sp.map(function(q,i){return '<button type="button" class="rtab" role="tab" data-i="'+i+'" aria-selected="'+(i?'false':'true')+'" style="--c:var(--'+q.sport+')">'+esc(L(q,'label')||x.sport[q.sport])+'</button>';}).join('')+'</div>';
    h+=sp.map(function(q,i){
      var md=['🥇','🥈','🥉'];
      return '<div class="rpanel" data-i="'+i+'"'+(i?' hidden':'')+'>'+(sp.length===1?'<h5>'+esc(L(q,'label')||x.sport[q.sport])+'</h5>':'')+
        (q.records&&q.records.length?'<ul class="rl rec">'+li(q.records)+'</ul>':'')+
        (q.events||[]).map(function(v){return '<div class="rev"><div class="rn">'+esc(L(v,'ev'))+(L(v,'rec')?' <span class="rbadge">'+esc(L(v,'rec'))+'</span>':'')+'</div><ol class="pod">'+
          (v.podium||[]).map(function(p,k){return '<li><span class="md">'+md[k]+'</span><span class="pn">'+esc(L(p,'n'))+(p.c?' <span class="pc">('+esc(p.c)+')</span>':'')+'</span>'+'<span class="pv'+(p.v?'':' na')+'">'+(p.v?esc(L(p,'v')):'–')+'</span>'+'</li>';}).join('')+'</ol></div>';}).join('')+
        (q.notes&&q.notes.length?'<ul class="rl">'+li(q.notes)+'</ul>':'')+'</div>';}).join('');
  }
  if(r.src&&r.src.length)h+='<h5>'+x.resSrc+'</h5><ul class="docs">'+r.src.map(function(q){return '<li><a href="'+esc(q.url)+'" target="_blank" rel="noopener">'+esc(L(q,'title')||q.url)+'</a></li>';}).join('')+'</ul>';
  return h+'</div>';
}
/* "More details": costs from the competition rules, an airfare estimate and official documents */
function xtraHtml(e){
  var x=t();
  function fee(k,v){return '<dt>'+k+'</dt>'+(v?'<dd>'+esc(v)+'<span class="sub">'+x.perRule+'</span></dd>':'<dd class="na">'+x.noAnn+'</dd>');}
  function num(n){return Number(n).toLocaleString(lang==='th'?'th-TH':'en-US');}
  /* airfare: full-service economy first (fewest stops), then a low-cost option where one fits */
  var f=e.flight,fl;
  function stops(n){return n===0||n==='0'?x.nonstop:x.stops(n);}
  function opt(k,o,from){
    if(!o||!o.min)return '<b>'+k+':</b> <span class="na">'+(o&&o.none?esc(L(o,'none')):x.na)+'</span>'+(o&&L(o,'carriers')?'<span class="sub">'+esc(L(o,'carriers'))+(o.stops!=null?' · '+stops(o.stops):'')+'</span>':'');
    return '<b>'+k+':</b> '+num(o.min)+(o.max&&o.max!==o.min?'–'+num(o.max):'')+' '+x.baht+
      '<span class="sub">'+esc(L(o,'carriers')||'')+(o.stops!=null?' · '+stops(o.stops):'')+' · '+esc(o.from||from)+' → '+esc(f.to)+
      (L(o,'note')?' · '+esc(L(o,'note')):'')+(o.src?' · <a href="'+esc(o.src)+'" target="_blank" rel="noopener">'+x.fsrc+'</a>':'')+'</span>';}
  if(f&&(f.fsc||f.lcc)){fl='<dd><div>'+opt(x.fsc,f.fsc,f.from)+'</div><div style="margin-top:6px">'+opt(x.lcc,f.lcc,f.from)+'</div>'+
    '<span class="sub" style="margin-top:6px">'+esc(f.to)+(L(f,'to_name')?' ('+esc(L(f,'to_name'))+')':'')+' · '+x.fcrit+(L(f,'note')?' · '+esc(L(f,'note')):'')+'</span>'+
    '<span class="sub">'+x.fnote+(f.asof?' · '+x.fasof+' '+esc(ymd(f.asof)):'')+'</span></dd>';}
  else fl='<dd class="na">'+x.na+'</dd>';
  var docs=(e.docs||[]).map(function(d){return '<li><a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(L(d,'title')||d.url)+'</a></li>';}).join('');
  return '<div class="xtra"><h4>'+x.xh+'</h4><dl>'+fee(x.lAccom,L(e,'accom'))+fee(x.lEntry,L(e,'entry_fee'))+fee(x.lOther,L(e,'other_fee'))+
   '<dt>'+x.lFlight+'</dt>'+fl+'<dt>'+x.lDocs+'</dt>'+(docs?'<dd><ul class="docs">'+docs+'</ul></dd>':'<dd class="na">'+x.noDocs+'</dd>')+'</dl></div>';
}
function placePop(px,py){
  lastXY=[px,py];var pw=pop.offsetWidth,ph=pop.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
  var left=px+16,top=py+16;
  if(left+pw>vw-8)left=Math.max(8,px-pw-16);
  if(left+pw>vw-8)left=Math.max(8,vw-pw-8);
  if(top+ph>vh-8)top=Math.max(8,py-ph-16);
  top=Math.max(8,Math.min(top,vh-ph-8)); /* tall cards stay fully on screen; the body scrolls if taller than the viewport */
  pop.style.left=left+'px';pop.style.top=top+'px';
}
function showPop(n,px,py,pin){
  var e=byId(n.dataset.id);if(!e)return;
  pop.innerHTML=popHtml(e);pop.hidden=false;pop.classList.remove('wide');pop.classList.toggle('pin',!!pin);placePop(px,py);
  Array.prototype.forEach.call(pop.querySelectorAll('.rtab'),function(b){b.onclick=function(ev){ev.stopPropagation();
    Array.prototype.forEach.call(pop.querySelectorAll('.rtab'),function(o){o.setAttribute('aria-selected',o===b?'true':'false');});
    Array.prototype.forEach.call(pop.querySelectorAll('.rpanel'),function(p){p.hidden=p.dataset.i!==b.dataset.i;});};});
  var mb=pop.querySelector('.more');if(mb)mb.onclick=function(ev){ev.stopPropagation();var w=pop.classList.toggle('wide');
    mb.textContent=w?t().less:(done(e)||live(e)?t().moreRes:t().more);mb.setAttribute('aria-expanded',w?'true':'false');
    pop.classList.add('anim');$('popbk').hidden=!w;
    if(w)centerPop();else placePop(lastXY[0],lastXY[1]);
    pop.classList.remove('grow');void pop.offsetWidth;pop.classList.add('grow');
    if(w){var bd=pop.querySelector('.bd'),xt=pop.querySelector('.xtra');setTimeout(function(){bd.scrollTo({top:Math.max(0,xt.offsetTop-bd.offsetTop-40),behavior:'smooth'});},120);}};
  Array.prototype.forEach.call(cal.querySelectorAll('[data-id="'+e.id+'"]'),function(q){q.classList.add('hl');});
  var xb=pop.querySelector('.x');if(xb)xb.onclick=function(ev){ev.stopPropagation();hidePop(true);};
}
/* expanded card sits in the middle of the screen */
function centerPop(){
  var pw=pop.offsetWidth,ph=pop.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
  pop.style.left=Math.max(8,(vw-pw)/2)+'px';pop.style.top=Math.max(8,(vh-ph)/2)+'px';
}
function hidePop(force){
  if(pinned&&!force)return;
  if(force){pinned=null;pop.dataset.id='';}
  pop.hidden=true;pop.classList.remove('pin','wide','anim','grow');$('popbk').hidden=true;
  Array.prototype.forEach.call(cal.querySelectorAll('.hl'),function(q){q.classList.remove('hl');});
}
cal.addEventListener('mousemove',function(ev){
  if(pinned)return;var n=ev.target.closest('[data-id]');
  if(!n){hidePop();return;}
  if(pop.hidden||pop.dataset.id!==n.dataset.id){hidePop(true);pop.dataset.id=n.dataset.id;showPop(n,ev.clientX,ev.clientY,false);}
  else placePop(ev.clientX,ev.clientY);
});
cal.addEventListener('mouseleave',function(){if(!pinned)hidePop(true);});
cal.addEventListener('click',function(ev){
  var n=ev.target.closest('[data-id]');if(!n)return;
  ev.stopPropagation();
  if(pinned===n.dataset.id){hidePop(true);return;}
  hidePop(true);pinned=n.dataset.id;pop.dataset.id=n.dataset.id;var r=n.getBoundingClientRect();
  showPop(n,Math.min(ev.clientX||r.left,r.right),r.bottom-16,true);
});
cal.addEventListener('focusin',function(ev){
  var n=ev.target.closest('.ev');if(!n||pinned)return;var r=n.getBoundingClientRect();
  hidePop(true);showPop(n,r.left,r.bottom-16,false);
});
cal.addEventListener('focusout',function(){if(!pinned)hidePop(true);});
document.addEventListener('click',function(ev){if(pinned&&!pop.contains(ev.target))hidePop(true);});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')hidePop(true);});
window.addEventListener('scroll',function(){if(!pinned)hidePop(true);},{passive:true});
window.addEventListener('resize',function(){if(!pop.hidden&&pop.classList.contains('wide'))centerPop();});
/* sponsor strip: duplicate logos once so the CSS marquee loops seamlessly */
(function(){var ul=document.querySelector('.sp-list');if(!ul||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  var wrap=document.createElement('div');wrap.className='sp-view';ul.parentNode.insertBefore(wrap,ul);wrap.appendChild(ul);
  Array.prototype.slice.call(ul.children).forEach(function(li){var c=li.cloneNode(true);c.setAttribute('aria-hidden','true');var im=c.querySelector('img');if(im)im.alt='';ul.appendChild(c);});
  ul.classList.add('marquee');})();

/* view + language */
function setView(v){document.body.classList.toggle('vl',v==='l');$('vc').setAttribute('aria-pressed',v==='c'?'true':'false');$('vl').setAttribute('aria-pressed',v==='l'?'true':'false');hidePop(true);}
$('y0').onclick=function(){show(cur%12);};
$('y1').onclick=function(){show(12+cur%12);};
$('y2').onclick=function(){show(24+cur%12);};
$('vc').onclick=function(){setView('c');};
$('vl').onclick=function(){setView('l');};
function setLang(l){lang=l;try{localStorage.setItem('tasa-lang',l);}catch(e){}hidePop(true);renderStatic();renderCal();}
document.addEventListener('click',function(ev){var b=ev.target.closest&&ev.target.closest('.lb');if(b)setLang(b.dataset.l);});
$('ftcopy').onclick=function(){
  var b=$('ftcopy'),mail='thaitaa@thaiaquatics.or.th';
  function ok(){b.textContent=t().copied;setTimeout(function(){b.textContent=t().copy;},1500);}
  try{navigator.clipboard.writeText(mail).then(ok,function(){sel();});}catch(e){sel();}
  function sel(){var r=document.createRange();r.selectNodeContents($('ftmail'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);}
};
var mb=$('minibar'),hd=$('apphd'),tick=false;
function updMini(){tick=false;var on=window.pageYOffset>hd.offsetHeight-8;mb.classList.toggle('show',on);}
window.addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(updMini);}},{passive:true});
window.addEventListener('resize',updMini);updMini();
setView(window.innerWidth<=640?'l':'c');
renderStatic();renderCal();
})();
</script>
